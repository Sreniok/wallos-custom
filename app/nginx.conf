user  nginx;
worker_processes  1;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    keepalive_timeout  65;

    server {
        listen       [::]:80 ipv6only=off;
        server_name  localhost;
        root         /var/www/html;
        index        index.php;

        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Content-Security-Policy "frame-ancestors 'self'; base-uri 'self'; object-src 'none'" always;

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location ^~ /.tmp/ {
            deny all;
            return 403;
        }

        location ^~ /backups/ {
            deny all;
            return 403;
        }

        location ~ /\.(?!well-known) {
            deny all;
            return 403;
        }

        location ~* \.(?:db|sqlite|sqlite3|sql|dump|bak|backup|env|ini|log|sh|yml|yaml|toml|lock)$ {
            deny all;
            return 403;
        }

        location ~ ^/(?:about|admin|calendar|health|index|login|logos|logout|passwordreset|profile|registration|settings|stats|subscriptions|totp|verifyemail)\.php$ {
            fastcgi_pass   127.0.0.1:9000;
            fastcgi_index  index.php;
            fastcgi_param  SCRIPT_FILENAME $document_root$fastcgi_script_name;
            include        fastcgi_params;
        }

        location ~ ^/(?:api|endpoints)/.+\.php$ {
            fastcgi_pass   127.0.0.1:9000;
            fastcgi_index  index.php;
            fastcgi_param  SCRIPT_FILENAME $document_root$fastcgi_script_name;
            include        fastcgi_params;
        }

        location ~ \.php$ {
            deny all;
            return 403;
        }
    }

    include /etc/nginx/conf.d/*.conf;
}
