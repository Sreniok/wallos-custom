services:
  wallos:
    container_name: wallos
    image: wallos-custom:latest
    build:
      context: ./app
      dockerfile: Dockerfile
    ports:
      - "8282:80/tcp"
    environment:
      TZ: '${TZ:-Europe/Dublin}'
      PUID: '${PUID:-82}'
      PGID: '${PGID:-82}'
      WALLOS_BACKUP_PATH: '${WALLOS_BACKUP_PATH:-/var/www/backups}'
      WALLOS_BACKUP_RETENTION_DAYS: '${WALLOS_BACKUP_RETENTION_DAYS:-30}'
      WALLOS_TRUST_PROXY_HEADERS: '${WALLOS_TRUST_PROXY_HEADERS:-false}'
      DEMO_MODE: '${DEMO_MODE:-false}'
    # Volumes store your data between container upgrades
    volumes:
      - './db:/var/www/html/db'
      - './logos:/var/www/html/images/uploads/logos'
      - './backups:/var/www/backups'
    restart: unless-stopped
